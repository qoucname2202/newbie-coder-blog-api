# Render Blueprint — Docker deployment
# Docs: https://render.com/docs/docker

services:
  - type: web
    name: newbie-coder-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
